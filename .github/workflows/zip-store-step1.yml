name: ZIP backup validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/utils/exportImport.ts'
      - '.github/workflows/zip-store-step1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build
