name: Fix ZIP media export strategy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make media entries Store-only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/utils/exportImport.ts')
          s = p.read_text()
          old = "if (ZIP_COMPRESSION_POLICY === 'balanced' && shouldCompressEntry(entry.name, original, entry.compress)) {"
          new = "const isMediaEntry = entry.name.startsWith('media/'); if (ZIP_COMPRESSION_POLICY === 'balanced' && !isMediaEntry && shouldCompressEntry(entry.name, original, entry.compress)) {"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
              print('Updated ZIP export: media/* entries now use Store.')
          else:
              print('Compression guard already updated; no source change needed.')
          PY

      - name: Install dependencies
        run: npm install

      - name: Build
        run: GITHUB_PAGES=true npm run build

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No changes were necessary.'
            exit 0
          fi
          git add src/utils/exportImport.ts package-lock.json
          git commit -m 'fix: store media entries uncompressed'
          git push origin HEAD:main
