name: Fix ZIP media export strategy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    if: ${{ !contains(github.event.head_commit.message, 'fix: store media entries uncompressed') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Make media entries Store-only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/utils/exportImport.ts')
          s = p.read_text()
          old = "if (ZIP_COMPRESSION_POLICY === 'balanced' && shouldCompressEntry(entry.name, original, entry.compress)) {"
          new = "const isMediaEntry = entry.name.startsWith('media/'); if (ZIP_COMPRESSION_POLICY === 'balanced' && !isMediaEntry && shouldCompressEntry(entry.name, original, entry.compress)) {"
          if old not in s:
              raise SystemExit('Expected ZIP compression guard was not found; refusing to modify the file.')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Build
        run: GITHUB_PAGES=true npm run build

      - name: Commit source fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No source changes were necessary.'
            exit 0
          fi
          git add src/utils/exportImport.ts
          git commit -m 'fix: store media entries uncompressed'
          git push origin HEAD:main
